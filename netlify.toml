# Netlify build & deploy configuration for Wenosoft Clarity
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Pin Node so local & Netlify builds match.
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

# ---------- SPA routing ----------
# React Router handles paths like /about, /services on the client.
# Without this, a direct visit (or refresh) would 404 on Netlify.
# This rewrites every unmatched path to index.html so React can render the route.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------- Cache headers ----------

# Hashed bundles (filename includes contenthash) — safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Favicon emitted by HtmlWebpackPlugin.
[[headers]]
  for = "/wenosoft-icon-purple.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html must never be cached — it points at the hashed assets.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Same for the root path.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# robots.txt and sitemap.xml — short cache so updates roll out fast.
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# ---------- Security headers ----------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
