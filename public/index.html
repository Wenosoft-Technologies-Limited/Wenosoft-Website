<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12103A" />
    <meta name="color-scheme" content="light dark" />

    <!--
      Resolve the theme before first paint so there is no flash of the wrong theme.
      Order: stored preference -> local time of day (06:00-18:00 = light) -> prefers-color-scheme.
      Keep the storage key and theme-color hexes in sync with src/components/ui-brand/ThemeToggle.tsx.
    -->
    <script>
      (function () {
        var theme;
        try {
          var stored = localStorage.getItem("wenosoft-theme");
          if (stored === "light" || stored === "dark") theme = stored;
        } catch (e) {
          /* storage unavailable */
        }
        if (!theme) {
          var hour = NaN;
          try {
            hour = parseInt(
              new Intl.DateTimeFormat(undefined, { hour: "numeric", hour12: false }).format(
                new Date(),
              ),
              10,
            );
          } catch (e) {
            /* Intl unavailable */
          }
          if (!isNaN(hour)) {
            theme = hour >= 6 && hour < 18 ? "light" : "dark";
          } else {
            theme =
              window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          }
        }
        document.documentElement.classList.toggle("dark", theme === "dark");
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "dark" ? "#12103A" : "#F9F9FB");
      })();
    </script>

    <title>Wenosoft Technologies | Clarity out of complexity</title>
    <meta
      name="description"
      content="Wenosoft Technologies is a software development and technology consulting partner that bridges the ability to think with the ability to build."
    />
    <meta name="author" content="Wenosoft Technologies" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="Wenosoft Technologies" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://wenosoft.com" />
    <meta property="og:title" content="Wenosoft Technologies | Clarity out of complexity" />
    <meta
      property="og:description"
      content="Wenosoft Technologies is a software development and technology consulting partner that bridges the ability to think with the ability to build."
    />
    <meta property="og:image" content="https://wenosoft.com/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Wenosoft_tech" />
    <meta name="twitter:image" content="https://wenosoft.com/og-image.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@400;500;600;700&family=Funnel+Sans:wght@400;500;600&display=swap&subset=latin"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      This site is built with React and requires JavaScript to be enabled in your browser.
    </noscript>
  </body>
</html>
